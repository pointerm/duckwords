name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# Pull requests, including forks, need source read access only. Live Reddit access
# is deliberately absent from every ordinary CI job.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local
  GOFIPS140: "off"

jobs:
  verify:
    name: Tests and quality gates
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go 1.26.6
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          cache: true
          cache-dependency-path: go.sum

      - name: Validate automation definitions
        run: |
          bash -n scripts/run-assignment.sh
          bash -n scripts/package-release.sh
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

      - name: Run format, module, vet, test, race, and build checks
        run: make verify

      - name: Run bounded fuzz smoke
        run: make fuzz-smoke FUZZ_TIME=1s

      - name: Require a clean generated-file diff
        run: |
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"

  analysis:
    name: Static, secret, and vulnerability analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go 1.26.6
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          cache: true
          cache-dependency-path: go.sum

      - name: Scan current tree and complete Git history for secrets
        run: make secret-scan

      - name: Run pinned Staticcheck
        run: make lint STATICCHECK_VERSION=v0.7.0

      # Pin the scanner independently of application dependencies. The scanner
      # queries the public Go vulnerability database but never executes the CLI.
      - name: Scan reachable Go code
        run: make vuln GOVULNCHECK_VERSION=v1.6.0

  container:
    name: Build and smoke-test container
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go 1.26.6
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          cache: true
          cache-dependency-path: go.sum

      - name: Verify production image and native/container fixture parity
        run: >-
          make docker-verify
          VERSION=ci
          COMMIT="${GITHUB_SHA}"
          BUILD_DATE=unknown
          DOCKER_IMAGE=duckwords:ci
          DOCKER_FIXTURE_IMAGE=duckwords:fixture-ci
          DOCKER_BUILD_FLAGS=--pull
